<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HisobPro — Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
  <div class="min-h-screen flex flex-col items-center justify-center px-4">
    <div class="max-w-2xl w-full text-center space-y-8">
      <div class="space-y-3">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-blue-600 text-white text-3xl font-bold shadow-lg">HP</div>
        <h1 class="text-4xl md:text-5xl font-bold text-slate-900 tracking-tight">HisobPro</h1>
        <p class="text-lg text-slate-600">Smart Business Management</p>
        <p class="text-base text-slate-500 font-medium">Ҳамаи ҳисобҳои магазин — дар як ҷо.</p>
      </div>
      <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-200">
        <div class="flex items-center justify-center gap-2 mb-4">
          <span class="w-3 h-3 rounded-full bg-green-500"></span>
          <span class="text-sm font-medium text-green-600">Демо-версия</span>
        </div>
        <h2 class="text-xl font-semibold text-slate-800 mb-3">Системаи идоракунии магазин ва POS</h2>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
          <div class="bg-slate-50 rounded-lg py-2 px-3 font-medium text-slate-700">POS / Фурӯш</div>
          <div class="bg-slate-50 rounded-lg py-2 px-3 font-medium text-slate-700">Маҳсулот</div>
          <div class="bg-slate-50 rounded-lg py-2 px-3 font-medium text-slate-700">Анбор</div>
          <div class="bg-slate-50 rounded-lg py-2 px-3 font-medium text-slate-700">Мизоҷон</div>
          <div class="bg-slate-50 rounded-lg py-2 px-3 font-medium text-slate-700">Қарзҳо</div>
          <div class="bg-slate-50 rounded-lg py-2 px-3 font-medium text-slate-700">Ҳисоботҳо</div>
        </div>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <a href="login.html" class="inline-flex items-center justify-center px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold transition shadow-md">Даромадан</a>
        <a href="https://github.com/kayumovyokub708-blip/HisobPro" target="_blank" class="inline-flex items-center justify-center px-6 py-3 rounded-xl bg-white border border-slate-300 text-slate-700 font-semibold hover:bg-slate-50 transition">GitHub</a>
      </div>
      <p class="text-xs text-slate-400">Демо · Бе сервер · Фақат барои дидан</p>
    </div>
  </div>
