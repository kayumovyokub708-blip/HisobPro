<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Даромадан — HisobPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 text-white text-2xl font-bold shadow-lg mb-4">HP</div>
      <h1 class="text-2xl font-bold text-slate-900">HisobPro</h1>
      <p class="text-slate-500 mt-1">Ба система дароед</p>
    </div>
    <form id="loginForm" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-200 space-y-5">
      <div id="error" class="hidden bg-red-50 text-red-600 text-sm rounded-lg px-4 py-3"></div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Номи корбар</label>
        <input id="username" type="text" value="admin" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Рамз</label>
        <input id="password" type="password" value="admin123" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" required />
      </div>
      <button type="submit" id="btn" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold transition shadow-md">Даромадан</button>
      <p class="text-center text-xs text-slate-400 pt-2">Демо: admin / admin123</p>
    </form>
    <p class="text-center mt-6"><a href="index.html" class="text-sm text-blue-600 hover:underline">← Бозгашт</a></p>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const error = document.getElementById('error');
      const btn = document.getElementById('btn');
      btn.textContent = 'Интизор шавед...';
      btn.disabled = true;
      setTimeout(() => {
        if (user === 'admin' && pass === 'admin123') {
          window.location.href = 'dashboard.html';
        } else {
          error.textContent = 'Номи корбар ё рамз нодуруст аст.';
          error.classList.remove('hidden');
          btn.textContent = 'Даромадан';
          btn.disabled = false;
        }
      }, 600);
    });
  </script>
</body>
</html>
